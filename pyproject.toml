[project]
name = "simbi-reach-out"
version = "1.0.0"
description = "Local-first, review-gated outreach workflow"
requires-python = ">=3.15.1,<3.16"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.9.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.16.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pip-audit==2.10.1",
  "urllib3==2.8.0", # Patched minimum for pip-audit's requests dependency.
  "pyinstaller==6.22.3",
  "ruff==0.17.2",
]

[project.scripts]
simbi = "app.cli:main"
simbi-worker = "app.worker:main"
simbi-server = "app.server:main"
simbi-windows = "app.windows:main"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
pythonpath = ["backend"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "E501", # Long SQL and error strings are clearer when kept intact.
  "S101", # Assertions are expected in the test suite.
  "S608", # Dynamic identifiers are selected exclusively from local allowlists.
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
