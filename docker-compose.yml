services:
  app:
    build: .
    environment:
      SIMBI_ENV: local
      SIMBI_DATABASE_PATH: /app/data/simbi.db
      SIMBI_FRONTEND_ORIGIN: http://127.0.0.1:8000
      SIMBI_COOKIE_SECURE: "false"
      SIMBI_AUTO_BACKUP: ${SIMBI_AUTO_BACKUP:-false}
      SIMBI_BACKUP_PATH: /app/backups
      SIMBI_REQUIRE_MAINTENANCE: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - simbi-data:/app/data
      - simbi-backups:/app/backups
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker", "--interval", "300"]
    environment:
      SIMBI_ENV: local
      SIMBI_DATABASE_PATH: /app/data/simbi.db
      SIMBI_FRONTEND_ORIGIN: http://127.0.0.1:8000
      SIMBI_COOKIE_SECURE: "false"
      SIMBI_AUTO_BACKUP: ${SIMBI_AUTO_BACKUP:-false}
      SIMBI_BACKUP_PATH: /app/backups
      SIMBI_REQUIRE_MAINTENANCE: "true"
    volumes:
      - simbi-data:/app/data
      - simbi-backups:/app/backups
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  simbi-data:
  simbi-backups:
